# Article Intelligence Data Tank — config.yaml
#
# 実際のニュース取得先は sources へ「公開RSS/公開API/公式発表」のURLを追加してください。
# 有料記事・ログイン必須ページ・利用規約が不明なスクレイピング対象は追加しないこと。
# sources が空の間は、scripts/run_ingestion.py は新着0件として安全に高速終了します。

article_tank:
  enabled: true
  timezone: "Asia/Tokyo"
  storage_backend: "local_sharded"   # JSONLシャード（将来 "parquet" 等へ拡張可能）
  storage_format: "jsonl"            # pyarrow/duckdbを追加インストールせずに動く既定実装
  hot_hours: 72
  warm_days: 90
  # 保持期間（retention）: この日数より古いシャード・索引行を次回実行時に自動削除し、
  # GitHub repoの無制限な肥大化を防ぐ（storage.purge_shards_before / index.delete_before）。
  # null にすると無期限保持（削除しない・従来動作）に戻せる。
  retention_days: 30
  overlap_hours: 48
  max_fetch_workers: 6
  source_timeout_seconds: 12
  source_retry_count: 1
  max_source_share: 0.25
  max_theme_share: 0.35
  max_event_cluster_articles: 3
  max_items_per_source: 200          # 1フィードあたり取り込む最大件数（初回の暴発防止・§8）
  market_reaction_first: true
  event_clustering_enabled: true
  bias_monitoring_enabled: true
  persist_public_fulltext: false
  persist_public_excerpt: true
  persist_private_body: false

publication:
  enabled: true
  backend: "local_static"            # local_static / github_pages / github_release / object_storage
  compression: "gzip"
  max_hot_articles: 100
  max_global_drivers: 20
  max_market_reactions: 30
  max_risk_items: 20
  max_event_clusters: 30
  max_historical_matches: 20
  max_source_health: 100
  package_max_uncompressed_mb: 5

# Source偏重（source concentration）制御・観測（Production Stabilization §9）。
# 保存段階では全記事を保持し、ここでの制御は候補・Package選定段階でのみ適用する。
#   - warning_share / critical_share: 新規記事に占める最多ソースの比率がこの閾値を
#     超えたら Summary に警告を出す（あくまで観測。件数だけで低品質扱いしない）。
#   - max_published_share: 配信Package(hot_articles)で同一ソースが占めてよい上限比率
#     （diversity.select_diverse に渡す。保存済み記事の削除は一切しない）。
source_balance:
  warning_share: 0.35
  critical_share: 0.60
  max_published_share: 0.20

# 日付品質ガード（Production Stabilization §7）。RSS/Atomのpublished_atが
# 未来/超過去/解析不能な場合、記事を破棄せず fetched_at へ補正し、date_inferred=true・
# 元文字列(raw_published_at)を保持する。これにより異常な年のシャードへ記事が
# 紛れ込んで retention に誤削除されるのを防ぐ。
date_quality:
  max_future_hours: 24     # 取得時刻より何時間以上未来なら異常とみなすか
  max_age_years: 20        # 何年以上前を異常とみなすか（通常ニュースfeed想定）

# ニュースソースは config/sources.yaml で管理する（§5）。初回のライブ取得前に
# `python scripts/run_ingestion.py --verify` で各URLの到達性を確認すること。
sources_file: "config/sources.yaml"

# 後方互換: ここへ直接ソースを書くこともできる（config/sources.yaml とマージされる）。
# 例: - { name: "official_source_example", url: "https://example.gov/press.rss", type: "rss",
#         trust: 0.9, country: "US", language: "en" }
sources: []

# 分類キーワード（§17 公平性）。src/tank/classify.py の DEFAULT_CATEGORY_KEYWORDS を
# 上書き・追加したい場合のみ指定する（省略時は既定辞書を使用）。
category_keywords: {}

data_dir: "data/article_store"
published_dir: "published/latest"
snapshots_dir: "published/snapshots"

# ===== Rashinban Private Insight Vault（private記事の保存・分析・未来予測） =====
# 本番の保存先はCloudflare Worker + KV（非公開）。ここはローカル開発/分析パイプラインの設定。
# 本リポジトリはPublicのため、data/private_insights/ は.gitignore済み＝絶対にcommitされない。
private_insight:
  enabled: true
  storage_backend: "private_local"    # ローカル開発/テスト用。本番はWorker+KV
  encrypt_raw_body: true              # Worker側でAES-GCM暗号化（ローカルAdapterは開発専用・平文）
  publish_derived_summary: true       # allowlistされた派生情報のみ公開レポートへ
  publish_raw_body: false             # 本文は絶対に公開しない（コード上もallowlistに存在しない）
  max_body_chars: 30000
  dedup_enabled: true
  analysis_enabled: true
  forecast_enabled: true
  forecast_review_enabled: true
  retention_days: null                # private領域はユーザーが削除操作するまで保持

private_insight_analysis:
  provider: ""                        # "" = ANTHROPIC_API_KEYがあればanthropic、無ければrule_based
  model: ""                           # 空 = 環境変数 PRIVATE_INSIGHT_MODEL / 既定値
  timeout_seconds: 60
  retry_count: 1
  fallback_to_rule_based: true
  # confidence上限（§9）。evidence_levelごとの上限
  confidence_caps:
    article_based_hypothesis: 0.60
    historically_supported: 0.75
    market_confirmed: 0.85
    speculative: 0.40
