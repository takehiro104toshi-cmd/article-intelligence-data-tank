# Article Intelligence Data Tank — ニュースソース定義（§5, §6）
#
# 公開RSS / Atom のみ。ログイン必須・有料本文・利用規約が不明なスクレイピング対象は
# 追加しないこと。全文取得は行わず、フィードの要約（summary）のみ取り込む。
#
# ★重要（到達性の確認）★
#   このファイルの URL は「公開RSS/Atomとして広く知られ、長期間安定している」ものを
#   選定していますが、ビルド環境（サンドボックス）はegressが制限されており各URLの
#   到達性を確認できませんでした。初回のライブ取得の前に、必ず次を実行してください:
#
#       python scripts/run_ingestion.py --verify
#
#   FAIL となったソースは enabled: false にするか、正しいURLへ修正してください。
#   仕様（§6）に従い、確認できないURLは enabled: false のまま（推測で有効化しない）。
#
# フィールド（§5）:
#   id / name / url / enabled / format(auto|rss|atom) / source_class /
#   country / region / language / primary_category / trust_score(0-100) /
#   fetch_interval_minutes
#
# source_class: primary_official / official_corporate / international_institution /
#               major_news / specialist_media / aggregator / unknown

