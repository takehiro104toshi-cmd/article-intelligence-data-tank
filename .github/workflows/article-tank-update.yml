name: Article Tank Update

# Article Intelligence Data Tank の独立ワークフロー（§11）。
#
# 1時間に複数回巡回する（従来は1日6回）。多くのRSSフィードは「最新20〜30件」しか
# 保持しないため、巡回間隔が長いと更新の激しい情報源で記事を取りこぼす。
# ETag/Last-Modified による条件付きGET（fetcher.py）が既に実装済みのため、
# 変更が無いソースへの巡回は HTTP 304 で即終了し、頻度を上げてもサーバー負荷・
# 実行コストはほぼ増えない（§ 429/403等への無理な再試行はしない、という方針とは
# 独立: 304は「変更なし」の正常応答であり再試行ではない）。
#
# Market Intelligence System（daily-market-brief）は1日6回のレポート生成の直前に
# 最新のPublished Packageを取得するため、1時間おきの更新であれば常に
# latest_minutes(30分)〜warning_minutes(90分)以内の鮮度で参照できる。
#
# Market Intelligence 側のworkflowから、この重い処理を直接呼び出さないこと
# （Data Tankは完全に独立したリポジトリ・スケジュールで動く）。
#
# ★注意（GitHub公式の既知の制約）: scheduled workflowはベストエフォートで、
# GitHub Actions全体が高負荷な時間帯は遅延・スキップ（実行そのものがドロップ）される。
# 特に「毎時0分」等の丸い分は世界中のワークフローが集中して最も間引かれやすい
# （GitHub公式ドキュメントが明記している既知の挙動）。実運用でも1本のcronだけでは
# 数時間おきにしか発火しない事象を確認した。
#
# 対策: 「1時間あたりの発火チャンスを増やす」定番手法。1時間に複数の実行枠を
# 丸い分（:00/:15/:30/:45）を避けて分散配置し、GitHubがいくつか間引いても
# そのうち1つは通る確率を上げる。ETag/304（変更なしは即終了）＋「変更が無ければ
# コミットしない」実装があるため、余分に発火してもコスト・commitはほぼ増えない
# （Publicリポジトリのため実行時間も無料）。cronはすべてUTC。

on:
  schedule:
    # 1時間に4回（:08 / :23 / :38 / :53）。GitHubのスケジュール間引き対策として
    # 冗長化。混雑する丸い分を避けている。実際に取得〜公開されるのは変更があった
    # 時だけ（304と空diffで無駄なcommitは発生しない）。
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード（normal=通常取得 / verify=enabled到達性 / verify_candidates=未有効候補の到達性）"
        required: false
        type: choice
        options: [normal, verify, verify_candidates]
        default: normal

permissions:
  contents: write

concurrency:
  group: article-tank-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-tank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # mode=verify/verify_candidates は到達性の診断のみ（保存・commitしない）。
      # 定期実行(schedule)は inputs が無いため常に normal として通常取得する。
      - name: Run ingestion and publish package
        id: ingest
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          case "${MODE:-normal}" in
            verify)            python scripts/run_ingestion.py --verify ;;
            verify_candidates) python scripts/run_ingestion.py --verify-candidates ;;
            *)                 python scripts/run_ingestion.py ;;
          esac

      # run_ingestion.py の終了コード2（degraded: 一部ソース失敗だが公開は成功）でも
      # GitHub Actionsはステップ失敗として後続をデフォルトでスキップしてしまうため、
      # 常にこのステップを実行する（if: always()）。せっかく取得・公開できた
      # データがcommitされずに失われることを防ぐ（終了コード1=全滅時は、
      # run_ingestion.py側で新規シャード・Packageの変更が発生しないため、
      # 下のgit diffが空になり自然にコミットはスキップされる＝安全）。
      - name: Commit and push tank data + published package
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article_store published 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします。"
          else
            git commit -m "Update article tank data and published package"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "push 競合またはネットワークエラー。${i} 回目の再試行をします..."
              sleep $((i*3))
            done
          fi

      # run統計(latest_run.json)から run_status・取得・保存・品質・配信・
      # Private Insight storage health を Summary へ整形表示する（§15 Observability）。
      # Private Insight は件数・storage healthのみで、本文・タイトルは一切出さない。
      - name: Write job summary
        if: always()
        run: python scripts/write_summary.py >> "$GITHUB_STEP_SUMMARY" || true
