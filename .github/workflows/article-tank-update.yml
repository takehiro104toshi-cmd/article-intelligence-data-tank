name: Article Tank Update

# Article Intelligence Data Tank の独立ワークフロー（§11）。
#
# 1時間おきに巡回する（従来は1日6回）。多くのRSSフィードは「最新20〜30件」しか
# 保持しないため、巡回間隔が長いと更新の激しい情報源で記事を取りこぼす。
# ETag/Last-Modified による条件付きGET（fetcher.py）が既に実装済みのため、
# 変更が無いソースへの巡回は HTTP 304 で即終了し、頻度を上げてもサーバー負荷・
# 実行コストはほぼ増えない（§ 429/403等への無理な再試行はしない、という方針とは
# 独立: 304は「変更なし」の正常応答であり再試行ではない）。
#
# Market Intelligence System（daily-market-brief）は1日6回のレポート生成の直前に
# 最新のPublished Packageを取得するため、1時間おきの更新であれば常に
# latest_minutes(30分)〜warning_minutes(90分)以内の鮮度で参照できる。
#
# Market Intelligence 側のworkflowから、この重い処理を直接呼び出さないこと
# （Data Tankは完全に独立したリポジトリ・スケジュールで動く）。

on:
  schedule:
    - cron: "0 * * * *"   # 毎時0分（UTC）＝1日24回
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: article-tank-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-tank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion and publish package
        run: python scripts/run_ingestion.py

      - name: Commit and push tank data + published package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article_store published 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします。"
          else
            git commit -m "Update article tank data and published package"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "push 競合またはネットワークエラー。${i} 回目の再試行をします..."
              sleep $((i*3))
            done
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### Article Tank Update 実行結果"
            echo ""
            if [ -f published/latest/manifest.json ]; then
              echo "- ✅ published/latest/manifest.json 生成"
            else
              echo "- ❌ published/latest/manifest.json が見つかりません"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
